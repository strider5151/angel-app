<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1E5B3A">
<meta name="description" content="Angel-Empfehlungen für Bonn und 200 km Umkreis: Rhein, Angelpark Caster, Angelläden und Lexikon.">
<title>Barsch-Buddy</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Nunito:wght@400;600;700;800&display=swap">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header class="top">
  <img class="logo" src="icons/perch.svg" alt="" width="40" height="28">
  <div class="top-text">
    <h1 id="pageTitle">Barsch-Buddy</h1>
    <p id="pageSub">Lade …</p>
  </div>
  <button class="icon-btn" id="refreshBtn" data-i18n-label="refresh" aria-label="Daten aktualisieren">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 11a8 8 0 0 0-14-5l-2 2"/><path d="M4 4v4h4"/><path d="M4 13a8 8 0 0 0 14 5l2-2"/><path d="M20 20v-4h-4"/></svg>
  </button>
  <button class="icon-btn" data-go="fangbuch" data-i18n-label="openLog" aria-label="Fangbuch öffnen">
    <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="3" width="14" height="18" rx="2"/><path d="M9 8h6M9 12h6M9 16h4"/></svg>
  </button>
  <button class="icon-btn" id="optionsBtn" data-i18n-label="options" aria-label="Optionen">
    <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
  </button>
</header>

<main id="app">
  <section class="view" id="view-heute" aria-label="Heute"></section>
  <section class="view" id="view-rhein" aria-label="Rhein" hidden></section>
  <section class="view" id="view-caster" aria-label="Angelpark Caster" hidden></section>
  <section class="view" id="view-shops" aria-label="Angelshops" hidden></section>
  <section class="view" id="view-lexikon" aria-label="Lexikon" hidden></section>
  <section class="view" id="view-fangbuch" aria-label="Fangbuch" hidden></section>
</main>

<nav class="tabs" data-i18n-label="nav" aria-label="Hauptnavigation">
  <button data-go="heute" aria-current="page"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 11l9-7 9 7"/><path d="M5 10v10h14V10"/></svg><span data-i18n="tab_heute">Heute</span></button>
  <button data-go="rhein"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 9c2.5-2 4.5-2 7 0s4.5 2 7 0 3.5-1.5 6 0"/><path d="M2 15c2.5-2 4.5-2 7 0s4.5 2 7 0 3.5-1.5 6 0"/></svg><span data-i18n="tab_rhein">Rhein</span></button>
  <button data-go="caster"><svg viewBox="0 0 24 24" aria-hidden="true"><ellipse cx="12" cy="15" rx="9" ry="5"/><path d="M12 10V3l5 3-5 2"/></svg><span data-i18n="tab_caster">Caster</span></button>
  <button data-go="shops"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 8h16l-1.5 12h-13z"/><path d="M9 8V6a3 3 0 0 1 6 0v2"/></svg><span data-i18n="tab_shops">Läden</span></button>
  <button data-go="lexikon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5a2 2 0 0 1 2-2h13v16H6a2 2 0 0 0-2 2z"/><path d="M4 19V5"/></svg><span data-i18n="tab_lexikon">Lexikon</span></button>
</nav>

<div class="modal" id="modal" hidden>
  <div class="modal-box" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <button class="modal-close" id="modalClose" data-i18n-label="close" aria-label="Schließen">✕</button>
    <div id="modalBody"></div>
  </div>
</div>

<script src="js/i18n.js"></script>
<script src="js/astro.js"></script>
<script src="js/oh.js"></script>
<script src="js/app.js"></script>
</body>
</html>
